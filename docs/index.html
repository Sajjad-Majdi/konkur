    --ink:#e8ebf3;--ink2:#b6bdcd;--ink3:#8c94a9;
    --line:rgba(232,235,243,.09);--line2:rgba(232,235,243,.17);
    --ai:#a395ff;--ai-soft:rgba(163,149,255,.15);--ds:#45cdb7;--ds-soft:rgba(69,205,183,.14);
    --hx:#8eaaff;--hx-soft:rgba(142,170,255,.14);--ex:#f2a06c;--ex-soft:rgba(242,160,108,.14);
    --ok:#52c98f;--ok-soft:rgba(82,201,143,.15);--bad:#ff7d73;--bad-soft:rgba(255,125,115,.13);--warn:#f0b35a;
    --on-acc:#121624;--press:rgba(232,235,243,.06);
    --glass:rgba(28,35,56,.62);--glass-brd:rgba(255,255,255,.09);
    --shadow:0 16px 40px -18px rgba(0,0,0,.75),0 2px 8px -2px rgba(0,0,0,.4);
    --shadow-s:0 8px 22px -14px rgba(0,0,0,.7);
    --sheet:rgba(18,22,36,.9);--wbg:rgba(14,18,32,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121624;--bg2:#0e1220;--surface:#1a2033;--surface2:#20283e;--raise:#262f48;
  --ink:#e8ebf3;--ink2:#b6bdcd;--ink3:#8c94a9;
  --line:rgba(232,235,243,.09);--line2:rgba(232,235,243,.17);
  --ai:#a395ff;--ai-soft:rgba(163,149,255,.15);--ds:#45cdb7;--ds-soft:rgba(69,205,183,.14);
  --hx:#8eaaff;--hx-soft:rgba(142,170,255,.14);--ex:#f2a06c;--ex-soft:rgba(242,160,108,.14);
  --ok:#52c98f;--ok-soft:rgba(82,201,143,.15);--bad:#ff7d73;--bad-soft:rgba(255,125,115,.13);--warn:#f0b35a;
  --on-acc:#121624;--press:rgba(232,235,243,.06);
  --glass:rgba(28,35,56,.62);--glass-brd:rgba(255,255,255,.09);
  --shadow:0 16px 40px -18px rgba(0,0,0,.75),0 2px 8px -2px rgba(0,0,0,.4);
  --shadow-s:0 8px 22px -14px rgba(0,0,0,.7);
  --sheet:rgba(18,22,36,.9);--wbg:rgba(14,18,32,.5);
  color-scheme:dark;
}
/* per-course accent rules (#v-<id>, .pat.<id>, ...) are generated by build.py from content/courses.json */
#v-exam{--acc:var(--ex);--acc-soft:var(--ex-soft)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vaz,Tahoma,"Segoe UI",sans-serif;font-size:15.5px;line-height:1.9;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.tt,.tt *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease!important}
button,input{font-family:inherit}
b,strong{font-weight:700;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vmax;height:55vmax;top:-22vmax;right:-18vmax;background:var(--ai-soft)}
.bg i:nth-child(2){width:50vmax;height:50vmax;bottom:-22vmax;left:-18vmax;background:var(--ds-soft);animation-duration:32s;animation-direction:alternate-reverse}
.bg i:nth-child(3){width:30vmax;height:30vmax;top:35%;left:30%;background:var(--hx-soft);opacity:.5;animation-duration:38s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,3vmax,0) scale(1.12)}}

.top{max-width:780px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:var(--shadow-s)}
.brand{font-weight:800;font-size:14.5px;line-height:1.35;color:var(--ink)}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.icon-btn{all:unset;box-sizing:border-box;margin-inline-start:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;transition:transform .18s,background .25s}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:scale(.88)}
main{max-width:780px;margin:0 auto;padding:4px 16px calc(112px + env(safe-area-inset-bottom))}
.view.enter{animation:vin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

h1{font-size:23px;font-weight:800;margin:0;line-height:1.5;color:var(--ink)}
h2{font-size:16.5px;font-weight:800;margin:0 0 8px;line-height:1.6;color:var(--ink)}
h3{font-size:14px;font-weight:800;margin:20px 0 6px;line-height:1.6;color:var(--acc);display:flex;align-items:center;gap:7px}
h3 svg{width:17px;height:17px;flex:none}
.sub{margin:2px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.8}
.sub span{color:var(--ink3);font-size:12.5px}
.lead{margin:-4px 0 10px;font-size:12.5px;color:var(--ink3);line-height:1.8}
.muted{color:var(--ink3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow-s)}
.src{margin:12px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.9;border-top:1px dashed var(--line2);padding-top:10px}
bdi.u{direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:.95em;color:var(--ink2)}
.facts{margin:10px 0 0;padding:0;list-style:none}
.facts li{position:relative;padding-inline-start:16px;margin:5px 0;font-size:13.5px;color:var(--ink2);line-height:1.85}
.facts li::before{content:"";position:absolute;inset-inline-start:2px;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* hero */
.hero{padding:16px 2px 4px}
.hero h1{font-size:26px}
.hrings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hrc{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:12px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow-s);cursor:pointer;transition:transform .18s,box-shadow .3s}
.hrc:active{transform:scale(.97)}
.hrc b{display:block;font-size:14px;line-height:1.5;color:var(--ink)}
.hrc small{display:block;font-size:11.5px;color:var(--ink3);line-height:1.5}
.ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .rt{stroke:var(--line)}
.ring .rv{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}

/* weights */
.wbar{display:flex;gap:4px;height:14px;border-radius:999px;overflow:hidden;margin:4px 0 12px}
.wbar span{position:relative;border-radius:4px;overflow:hidden}
.wl{background:var(--line2)}
.wm{background:color-mix(in srgb,var(--hx) 40%,transparent)}
.ws{background:color-mix(in srgb,var(--ink3) 45%,transparent)}
.ws i{position:absolute;inset-block:0;inset-inline-start:0;width:37.5%;background:linear-gradient(90deg,var(--ds),var(--ai));animation:grow 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.wrows{display:grid;gap:2px}
.wr{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);padding:3px 0}
.wr b{color:var(--ink);font-weight:700}
.sw{width:12px;height:12px;border-radius:4px}
.sw.wgr{background:linear-gradient(90deg,var(--ds),var(--ai))}
.wr.sub{padding-inline-start:16px;font-size:13px}
.wr.sub b{font-weight:600;color:var(--ink2)}
.focus{display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--ai-soft),var(--ds-soft));border:1px solid var(--line)}
.focus .big{font-size:32px;font-weight:800;line-height:1.3;color:var(--ink);flex:none;padding-top:2px}
.focus span{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.7}
.focus small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}

/* rank */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rk{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .15s;border:1px solid transparent}
.rk:hover{background:var(--press)}
.rk:active{transform:scale(.985);background:var(--acc-soft)}
.rn{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--acc);background:var(--acc-soft)}
.rt{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.55;color:var(--ink)}
.rt small{display:block;font-weight:500;font-size:11.5px;color:var(--acc)}
.rf{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;color:var(--ink3);line-height:1.6;text-align:left}

/* plan */
.ch2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ch2 h2{margin:0}
.plan{position:relative}
.pl{list-style:none;margin:0;padding:0;display:none}
.pl.on{display:grid;gap:4px;animation:vin .45s cubic-bezier(.2,.8,.2,1) both}
.prow{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .15s}
.prow:hover{background:var(--press)}
.prow:active{transform:scale(.985)}
.pcb{flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line2);display:grid;place-items:center;margin-top:2px;color:transparent;transition:background .25s,border-color .25s,color .25s,transform .25s}
.pcb svg{width:15px;height:15px;stroke-width:2.6}
.prow.on .pcb{background:var(--ok);border-color:var(--ok);color:var(--on-acc);transform:scale(1.06)}
.pd{flex:none;width:52px;font-size:12px;font-weight:800;color:var(--acc);padding-top:3px}
.ptx{flex:1;font-size:13.5px;color:var(--ink);line-height:1.8}
.prow.on .ptx{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.srcs{margin:0;padding:0;list-style:none}
.srcs li{font-size:13px;color:var(--ink2);margin:6px 0;padding-inline-start:14px;position:relative;line-height:1.85}
.srcs li::before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}

/* segmented */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;padding:4px 11px;border-radius:10px;font-size:12.5px;font-weight:700;line-height:1.9;color:var(--ink2);cursor:pointer;text-align:center;transition:background .25s,color .25s,transform .15s,box-shadow .25s}
.seg button.on{background:var(--raise);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.seg button:active{transform:scale(.94)}
.seg.full{display:flex;width:100%;margin-top:8px}
.seg.full button{flex:1}

/* course head */
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 4px}
.cring{position:relative;flex:none;display:grid;place-items:center}
.cring .ring{width:58px;height:58px}
.cring small{position:absolute;font-size:11px;font-weight:800;color:var(--acc);line-height:1}

/* pattern card */
.plist{margin-top:10px}
.pat{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin:10px 0;box-shadow:var(--shadow-s);transition:box-shadow .35s,border-color .35s;scroll-margin-top:12px}
.pat.open{box-shadow:var(--shadow);border-color:var(--line2)}
.pat-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-radius:20px;transition:background .2s}
.pat-h:hover{background:var(--press)}
.pat-h:active{background:var(--acc-soft)}
.pid{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:800;font-size:13.5px;color:var(--acc);background:var(--acc-soft);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.pat.open .pid{transform:rotate(-8deg) scale(1.06)}
.pt{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.55;color:var(--ink)}
.pt small{display:block;direction:ltr;text-align:right;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:500;font-size:11.5px;color:var(--ink3);line-height:1.5}
.dots{display:flex;gap:4px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2);transition:background .3s,transform .3s}
.dot.ok{background:var(--ok)}
.dot.done{background:var(--acc)}
.dot.bad{background:var(--bad)}
.chev{flex:none;color:var(--ink3);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.chev svg{width:20px;height:20px}
.pat.open .chev{transform:rotate(180deg)}
.pat-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.pat.open .pat-b{grid-template-rows:1fr}
.pat-in{min-height:0;overflow:hidden}
.pat-pad{padding:0 16px 18px;opacity:0;transform:translateY(-6px);transition:opacity .35s .05s,transform .45s cubic-bezier(.2,.8,.2,1)}
.pat.open .pat-pad{opacity:1;transform:none}
.freq{display:flex;align-items:center;gap:7px;margin:0 0 4px;padding-top:2px;font-size:12.5px;color:var(--ink3)}
.freq svg{width:15px;height:15px;flex:none;color:var(--acc)}
.cue,.how,.trap{margin:0;padding:0;list-style:none}
.cue li,.how li,.trap li{position:relative;padding-inline-start:26px;margin:7px 0;color:var(--ink);line-height:1.95}
.cue li::before{content:"";position:absolute;inset-inline-start:7px;top:.72em;width:8px;height:8px;border-radius:3px;background:var(--acc);opacity:.75;transform:rotate(45deg)}
.how{counter-reset:h}
.how li::before{counter-increment:h;content:counter(h,persian);position:absolute;inset-inline-start:0;top:.3em;width:19px;height:19px;border-radius:7px;background:var(--acc-soft);color:var(--acc);font-size:11.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.traps{margin-top:16px;padding:2px 14px 8px;border-radius:16px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 22%,transparent)}
.traps h3{color:var(--bad);margin-top:12px}
.trap li::before{content:"!";position:absolute;inset-inline-start:2px;top:.32em;width:17px;height:17px;border-radius:50%;background:var(--bad);color:var(--surface);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.trap.big li{margin:9px 0}

/* math */
.m{font-family:"Cambria Math",Cambria,"STIX Two Math","Times New Roman","Noto Serif",serif;font-size:1.06em;unicode-bidi:isolate;direction:ltr;white-space:normal;line-height:1.5}
.m i{font-style:italic}
.m sup,.m sub{font-size:.72em;line-height:0;font-style:normal}
.m sup i,.m sub i{font-style:italic}
.m .rel{margin:0 .22em}
.m .bo{margin:0 .16em}
.m .fn{font-style:normal;margin:0 .14em 0 .06em}
.m .ts{display:inline-block;width:.18em}
.m .bop{font-size:1.15em;margin:0 .06em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em;line-height:1.15;white-space:nowrap}
.fr .nu{padding:0 .18em .08em;border-bottom:1px solid currentColor}
.fr .de{padding:.08em .18em 0}
.sq{white-space:nowrap}
.sq .sr{font-style:normal}
.sq .sx{border-top:1px solid currentColor;padding:0 .1em;margin-inline-start:-.04em}
pre.code{direction:ltr;text-align:left;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:13px;line-height:1.6;overflow-x:auto;color:var(--ink)}

/* tables */
.tw{overflow-x:auto;margin:10px 0 2px;-webkit-overflow-scrolling:touch}
.dt{border-collapse:separate;border-spacing:0;font-size:13px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;min-width:100%}
.dt th,.dt td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;color:var(--ink)}
.dt tr:last-child th,.dt tr:last-child td{border-bottom:0}
.dt th{background:var(--bg2);font-weight:700;color:var(--ink2)}
.dt.st td.y{color:var(--ok);font-weight:700}
.dt.st td.n{color:var(--bad);font-weight:700}
.dt.st td.p{color:var(--warn);font-weight:700}
.dt.st tbody th{font-family:"Segoe UI",Roboto,Arial,sans-serif;text-align:right}

/* question */
.q{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.q-e{border-color:color-mix(in srgb,var(--acc) 28%,var(--line))}
.qm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-bottom:6px;line-height:1.6}
.qy{color:var(--acc);font-weight:500}
.qy b{font-weight:800}
.qk{padding:1px 8px;border-radius:8px;background:var(--bg2);color:var(--ink2);font-size:11.5px}
.qt{color:var(--ink);font-weight:500;line-height:2}
.fig{margin:10px 0 0;padding:10px;border-radius:14px;background:var(--wbg);border:1px solid var(--line)}
.fig svg{max-width:440px;margin:0 auto;width:100%;height:auto}
.opts{display:grid;gap:7px;margin-top:12px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;line-height:1.85;color:var(--ink);font-size:14.5px;transition:transform .16s,background .25s,border-color .25s,box-shadow .25s}
.opt:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line2))}
.opt:active{transform:scale(.985)}
.q-e .opt{cursor:default}
.q-e .opt:active{transform:none}
.onum{flex:none;width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);color:var(--ink2);font-weight:800;font-size:12.5px;line-height:1;margin-top:2px;transition:background .25s,color .25s}
.ot{flex:1;min-width:0;overflow-wrap:anywhere}
.om{flex:none;width:20px;height:20px;margin-top:4px;color:transparent}
.om svg{width:20px;height:20px;stroke-width:2.4}
.opt.ok,.opt.key{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .onum,.opt.key .onum{background:var(--ok);color:var(--on-acc)}
.opt.ok .om,.opt.key .om{color:var(--ok)}
.opt.ok{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .42s}
.opt.bad .onum{background:var(--bad);color:var(--surface)}
.opt.bad .om{color:var(--bad)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 1px var(--acc) inset}
.opt.sel .onum{background:var(--acc);color:var(--on-acc)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fb{min-height:0;font-size:13px;font-weight:700}
.fb span{display:inline-flex;align-items:center;gap:6px;margin-top:10px;animation:vin .35s both}
.fb svg{width:17px;height:17px;stroke-width:2.4}
.fb-ok{color:var(--ok)}
.fb-bad{color:var(--bad)}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps:empty{display:none}
.steps li{position:relative;padding:8px 12px;padding-inline-start:38px;border-radius:13px;margin:6px 0;background:var(--surface);border:1px solid var(--line);line-height:2;color:var(--ink);animation:stepIn .45s cubic-bezier(.2,.8,.2,1) both}
.steps li::before{counter-increment:s;content:counter(s,persian);position:absolute;inset-inline-start:9px;top:10px;width:21px;height:21px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:11.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.steps li b{color:var(--ok)}
@keyframes stepIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.qa{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:13px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:13.5px;line-height:1.5;cursor:pointer;transition:transform .15s,filter .2s,opacity .25s,background .25s}
.btn svg{width:17px;height:17px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.95);filter:brightness(.92)}
.btn.ghost{background:var(--acc-soft);color:var(--acc)}
.btn.soft{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.big{min-height:46px;padding:0 22px;font-size:14.5px;border-radius:15px;margin-top:6px}

/* widgets */
.wg{margin:18px 0 4px;padding:12px;border-radius:18px;background:var(--wbg);border:1px solid var(--line2)}
.wg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wg-t{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:var(--ink)}
.wg-t svg{width:17px;height:17px;color:var(--acc)}
.svgbox{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:6px;overflow:hidden}
.svgbox svg{width:100%;height:auto;max-height:340px;margin:0 auto}
.abs,.hgs,.hps,.bns{direction:ltr}
.abs text,.hgs text,.hps text,.bns text{direction:ltr;unicode-bidi:plaintext;text-anchor:middle;font-family:"Segoe UI",Roboto,Arial,sans-serif}
.ab-e{stroke:var(--line2);stroke-width:1.6;transition:opacity .3s}
.ab-e.pr{stroke-dasharray:4 4;opacity:.45}
.ab-cut{stroke:var(--bad);stroke-width:2.4;stroke-linecap:round}
.ab-tri{stroke-width:1.6;stroke-linejoin:round;transition:fill .3s}
.ab-tri.mx{fill:var(--ai-soft);stroke:var(--ai)}
.ab-tri.mn{fill:var(--ds-soft);stroke:var(--ds)}
.ab-leaf{fill:var(--surface2);stroke:var(--line2);stroke-width:1.4}
.ab-v{font-size:13px;font-weight:700;fill:var(--ink)}
.ab-v.in{font-size:12px}
.ab-ab{font-size:10px;font-weight:600;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.ab-lb{font-size:12px;font-weight:800;fill:var(--acc)}
.ab-n{transition:opacity .3s}
.ab-n.pr{opacity:.3}
.ab-n.vis .ab-leaf{fill:var(--acc-soft);stroke:var(--acc)}
.ab-halo{fill:none;stroke:var(--acc);stroke-width:2.2;opacity:.9;animation:halo 1.3s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.35}50%{opacity:1}}
.abmsg{margin:8px 0 0;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;min-height:44px;line-height:1.9;color:var(--ink);animation:vin .3s both}
.abmsg.end{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.cb{all:unset;box-sizing:border-box;width:42px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line2);color:var(--ink);cursor:pointer;transition:transform .15s,background .2s,opacity .2s}
.cb svg{width:19px;height:19px}
.cb.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);width:54px}
.cb:active{transform:scale(.9)}
.cb[disabled]{opacity:.35;pointer-events:none}
.cnt{min-width:70px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
.leafed{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink2)}
.leafin{display:flex;gap:5px;flex-wrap:wrap}
.in{all:unset;box-sizing:border-box;height:34px;padding:0 6px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;transition:border-color .2s,box-shadow .2s;cursor:text}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.in.sm{width:42px}
.in.wide{width:100%;text-align:left;padding:0 12px;height:40px;margin:2px 0 8px}
.hgs{max-width:420px}
.hg-e{stroke:var(--line2);stroke-width:2;transition:stroke .3s}
.hg-e.bad{stroke:var(--bad);stroke-width:3}
.hg-ar{fill:var(--ink3)}
.hg-ar.bad{fill:var(--bad)}
.hg-w{font-size:13px;font-weight:800;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.hg-w.bad{fill:var(--bad)}
.hg-n{fill:var(--surface2);stroke:var(--ink3);stroke-width:1.6;transition:stroke .3s,fill .3s}
.hg-n.start{stroke:var(--hx)}
.hg-n.goal{fill:var(--ok-soft);stroke:var(--ok)}
.hg-n.bad{stroke:var(--bad);stroke-width:2.6;fill:var(--bad-soft)}
.hg-l{font-size:14px;font-weight:800;fill:var(--ink)}
.hg-h{font-size:12px;font-weight:700;fill:var(--acc)}
.hg-h.bad{fill:var(--bad)}
.hg-hs{font-size:11px;fill:var(--ink3)}
.ht{margin-top:2px}
.hin{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.hin label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink2);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.hres{display:grid;gap:6px;margin-top:10px}
.hr{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.hr-i svg{width:18px;height:18px;stroke-width:2.6}
.hr.good .hr-i{color:var(--ok)}
.hr.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.hr.bad .hr-i{color:var(--bad)}
.hr b{color:var(--ink)}
.hr-s{color:var(--ink2);font-size:12.5px}
.hr-l{grid-column:1/-1;font-size:13px;color:var(--ink);line-height:2}
.mf{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:17px;color:var(--ink)}
.stps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.stp-l{white-space:nowrap}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 6px 5px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:opacity .25s}
.stp.off{opacity:.35;pointer-events:none}
.stp-l{font-size:12.5px;font-weight:700;color:var(--ink2);padding-inline-start:4px}
.stp-c{display:flex;align-items:center;gap:2px}
.stp-c button{all:unset;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s;font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1}
.stp-c button:active{transform:scale(.86);background:var(--acc-soft)}
.stp-c output{min-width:30px;text-align:center;font-weight:800;font-size:14px;color:var(--acc)}
.mres{display:grid;gap:6px;margin-top:10px}
.mr{padding:7px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink);line-height:1.9}
.mr.big{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:16px;border-color:var(--acc);background:var(--acc-soft);animation:vin .35s both}
.tag{font-size:12px;font-weight:800;color:var(--acc)}
.hps circle{fill:var(--surface2);stroke:var(--line2);stroke-width:1.4;transition:fill .35s,stroke .35s}
.hps text{font-size:11px;font-weight:700;fill:var(--ink3)}
.hp-e{stroke:var(--line2);stroke-width:1.3}
.hp-n.on circle{fill:var(--acc);stroke:var(--acc);animation:pop .5s var(--d) both}
.hp-n.on text{fill:var(--on-acc)}
.hstrip{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;justify-content:flex-start}
.hc{min-width:30px;height:26px;padding:0 4px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink3);transition:background .3s,color .3s}
.hc.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.hpos{margin-top:10px;font-size:13.5px;color:var(--ink);line-height:2}
.hm{display:grid;gap:4px}
.hmr{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;animation:stepIn .4s both}
.hn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:800}
.hsum{margin-top:8px}
.htot,.hcmp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;border-radius:12px;font-size:13px;color:var(--ink2)}
.htot{background:var(--acc-soft);border:1px solid var(--acc);color:var(--ink);font-weight:700;margin-bottom:4px}
.htot b{font-size:20px;color:var(--acc)}
.hcmp b{color:var(--ink)}
.dt.hl td b{color:var(--acc)}
.bnf{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.bns{width:200px;max-width:100%}
.cpts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cpt{min-width:0;font-size:12.5px}
.cpt th,.cpt td{padding:3px 7px}
.pace b small,.rc b small{font-size:.45em;font-weight:700;margin:0 .25em 0 .5em;opacity:.8}
.rc b small{font-size:.62em}

/* exam */
.pace{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pace>div{padding:12px;border-radius:16px;background:var(--acc-soft);border:1px solid var(--line)}
.pace b{display:block;font-size:26px;font-weight:800;color:var(--acc);line-height:1.4;direction:rtl}
.pace span{font-size:12.5px;color:var(--ink2);line-height:1.8}
.formula{text-align:center;font-size:24px;padding:10px;color:var(--ink)}
.fdesc{text-align:center;margin:0;font-size:13px;color:var(--ink2);line-height:2}
.evbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.evbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.evr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.evn{font-size:20px;color:var(--ink)}
.evr b{margin-inline-start:auto;padding:2px 10px;border-radius:9px}
.ev-y{background:var(--ok-soft);color:var(--ok)}
.ev-p{background:var(--acc-soft);color:var(--warn)}
.ev-n{background:var(--bad-soft);color:var(--bad)}
.passes{list-style:none;margin:0;padding:0;counter-reset:p;display:grid;gap:8px}
.passes li{position:relative;padding:10px 12px;padding-inline-start:46px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.passes li::before{counter-increment:p;content:counter(p,persian);position:absolute;inset-inline-start:12px;top:12px;width:24px;height:24px;border-radius:8px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:13px;display:grid;place-items:center;line-height:1}
.passes b{display:block;font-size:14px;color:var(--ink)}
.passes span{font-size:13px;color:var(--ink2);line-height:1.85}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates>div{padding:12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.dates span{display:block;font-size:12px;color:var(--ink3)}
.dates b{font-size:14.5px;color:var(--ink);line-height:1.7}
.tcard{border-color:color-mix(in srgb,var(--acc) 35%,var(--line));background:linear-gradient(160deg,var(--acc-soft),transparent 60%),var(--surface)}
.tst{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:4px}
.tst:empty{display:none}
.tst b{color:var(--acc);font-size:15px}

/* nav pill */
.pill{position:fixed;z-index:30;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(470px,calc(100% - 24px));height:64px;display:flex;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.pill button{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;color:var(--ink3);position:relative;z-index:1;cursor:pointer;transition:color .35s,transform .15s;white-space:nowrap}
.pill button svg{width:21px;height:21px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.pill button.on svg{transform:translateY(-1px) scale(1.08)}
.pill button:active{transform:scale(.92)}
.pill button[data-v="home"].on{color:var(--hx)}
.pill button[data-v="exam"].on{color:var(--ex)}
.pill .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--raise);box-shadow:0 2px 10px -3px rgba(0,0,0,.25),0 0 0 1px var(--line);transition:transform .5s cubic-bezier(.3,1.25,.5,1),width .5s cubic-bezier(.3,1.25,.5,1)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--sheet);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);animation:sheetIn .45s cubic-bezier(.2,.8,.2,1) both}
.sheet.out{animation:sheetOut .26s ease-in both}
@keyframes sheetIn{from{opacity:0;transform:translate3d(0,40px,0)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translate3d(0,30px,0)}}
.sh-h{display:flex;align-items:center;gap:12px;width:100%;max-width:780px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.sh-t{flex:1;min-width:0;line-height:1.5}
.sh-t b{display:block;font-size:15px;color:var(--ink)}
.sh-n{font-size:12px;color:var(--ink3)}
.sh-h .icon-btn{margin:0}
.timer{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:800;direction:ltr;transition:background .3s,color .3s}
.timer b{font-size:19px;line-height:1.4}
.timer i{width:2px;height:15px;border-radius:2px;background:currentColor;opacity:.5;animation:blink 1s steps(2) infinite}
.timer span{font-size:15px;line-height:1.4;opacity:.85}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.timer.stop i{animation:none}
@keyframes blink{50%{opacity:.1}}
.sh-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:2px 16px 8px;max-width:780px;margin:0 auto;width:100%}
.sh-dots button{all:unset;box-sizing:border-box;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink3);background:var(--surface);border:1px solid var(--line2);cursor:pointer;transition:transform .15s,background .25s,color .25s,border-color .25s}
.sh-dots button:active{transform:scale(.88)}
.sh-dots button.ans{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.sh-dots button.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;color:var(--acc)}
.sh-b{flex:1;overflow-y:auto;width:100%;max-width:780px;margin:0 auto;padding:0 16px 110px;-webkit-overflow-scrolling:touch}
.sh-b .q.enter{animation:vin .4s cubic-bezier(.2,.8,.2,1) both}
.sh-b .q{background:var(--surface)}
.sh-b .opt{background:var(--surface2)}
.sh-f{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(470px,calc(100% - 24px));display:flex;gap:8px;padding:7px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.sh-f .btn{flex:1;border-radius:999px;min-height:44px}
.res .score{text-align:center;padding:18px 0 8px}
.res .score b{display:block;font-size:46px;font-weight:800;color:var(--acc);line-height:1.3}
.res .score span{font-size:12.5px;color:var(--ink3)}
.rc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.rc>div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.rc b{display:block;font-size:18px;color:var(--ink);line-height:1.5}
.rc span{font-size:11.5px;color:var(--ink3)}
.rc .g b{color:var(--ok)}
.rc .b b{color:var(--bad)}
.best{text-align:center;font-size:13px;color:var(--ink2);margin:8px 0 0}
.res h3{margin-top:18px}
.rv{margin:8px 0;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.rv summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .2s}
.rv summary::-webkit-details-marker{display:none}
.rv summary:active{background:var(--press)}
.rv-n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--bg2);color:var(--ink2)}
.rv.good .rv-n{background:var(--ok);color:var(--on-acc)}
.rv.bad .rv-n{background:var(--bad);color:var(--surface)}
.rv-t{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.6}
.rv-t small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.rv-a{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;color:var(--ink3);line-height:1.6}
.rv-a b{color:var(--ok);font-size:12.5px}
.rv-b{padding:0 12px 12px;animation:vin .35s both}
.opts-r{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.opts-r li{display:flex;gap:8px;align-items:flex-start;padding:6px 9px;border-radius:11px;border:1px solid var(--line);font-size:13.5px;color:var(--ink);line-height:1.85}
.opts-r li.k{border-color:var(--ok);background:var(--ok-soft)}
.opts-r li.w{border-color:var(--bad);background:var(--bad-soft)}
.opts-r .onum{width:22px;height:22px;font-size:11.5px}

@media (min-width:720px){
  body{font-size:16px}
  .card{padding:20px}
  .pat-pad{padding:0 22px 22px}
  .q{padding:16px 18px}
  .hero{padding-top:26px}
  .hero h1{font-size:30px}
}
@media (max-width:380px){
  body{font-size:15px}
  .pill button{font-size:10.5px}
  .hrc{padding:10px;gap:8px}
  .ring{width:40px;height:40px}
  .wr{gap:7px;font-size:13px}
  .pd{width:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.m .mw{white-space:nowrap}

/* ===== v2: registration reminder, countdown, course map, exam structure, review blocks ===== */
.reg{--acc:var(--ex);--acc-soft:var(--ex-soft);border-color:color-mix(in srgb,var(--ex) 40%,var(--line));background:linear-gradient(160deg,var(--ex-soft),transparent 70%),var(--surface)}
.reg-h{display:flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.6;color:var(--ink)}
.reg-h svg{width:20px;height:20px;flex:none;color:var(--acc)}
.reg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.reg-n{display:flex;align-items:baseline;gap:8px}
.reg-n b{font-size:30px;font-weight:800;line-height:1.3;color:var(--acc)}
.reg-n span{font-size:13px;color:var(--ink2);font-weight:700}
.reg-d{margin:0;font-size:13.5px;font-weight:700;color:var(--ink2)}
.reg-a{width:100%}
.reg-a bdi.u{color:inherit;opacity:.85}
.reg.open{background:var(--ex);border-color:var(--ex);box-shadow:var(--shadow);animation:regPulse 2.6s ease-in-out infinite}
.reg.open .reg-h,.reg.open .reg-h svg,.reg.open .reg-n b,.reg.open .reg-n span,.reg.open .reg-d{color:var(--on-acc)}
.reg.open .reg-n b{font-size:24px}
.reg.open .reg-a{background:var(--on-acc);color:var(--ex)}
@keyframes regPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 5px var(--ex-soft),var(--shadow)}}
.cdcard{padding:14px 16px}
.cd{display:flex;align-items:center;gap:14px}
.cd-n{flex:none;min-width:82px;padding:8px 10px;border-radius:16px;background:var(--hx-soft);text-align:center;line-height:1.2}
.cd-n b{display:block;font-size:30px;font-weight:800;color:var(--hx)}
.cd-n span{font-size:12px;font-weight:700;color:var(--ink2)}
.cd-t{display:flex;flex-direction:column;line-height:1.7;min-width:0}
.cd-t b{font-size:15px;color:var(--ink)}
.cd-t span{font-size:13.5px;color:var(--ink2);font-weight:700}
.cd-t small{font-size:11.5px;color:var(--ink3)}
.cg{margin-top:10px}
.cg-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:6px}
.cg-h b{font-size:13.5px;color:var(--ink2)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);min-width:0}
.cc-i{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.cc-i svg{width:18px;height:18px}
.cc-t{min-width:0;line-height:1.5}
.cc-t b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.cc-t small{display:block;font-size:11.5px;color:var(--acc)}
.cc.live{cursor:pointer;transition:transform .15s,background .2s;border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.cc.live:hover{background:var(--acc-soft)}
.cc.live:active{transform:scale(.97)}
.cc.soon{opacity:.62}
.cc.soon .cc-i{background:var(--bg2);color:var(--ink3)}
.cc.soon small{display:inline-block;width:auto;margin-top:2px;padding:0 8px;border-radius:7px;background:var(--bg2);color:var(--ink3);font-weight:700}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{padding:10px 12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.sg-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--acc);font-weight:800;margin-bottom:4px}
.sg-h b{color:var(--ink);font-size:14px}
.sg ul{margin:0;padding:0;list-style:none}
.sg li{font-size:13px;color:var(--ink2);line-height:1.9;padding-inline-start:12px;position:relative}
.sg li::before{content:"";position:absolute;inset-inline-start:0;top:.85em;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.sg li.on{color:var(--ink);font-weight:700}
.sg li.on::before{background:var(--acc)}
.sx{margin:10px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.9}
.sx b{color:var(--ink)}
.pill.many{overflow-x:auto;scrollbar-width:none}
.pill.many::-webkit-scrollbar{display:none}
.pill.many button{flex:0 0 auto;padding:0 12px}
.rvw{margin:2px 0 12px;border-radius:16px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.rvw summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;color:var(--acc);font-size:14px}
.rvw summary::-webkit-details-marker{display:none}
.rvw summary svg{width:17px;height:17px;flex:none}
.rvw summary b{flex:1;font-weight:800}
.rvw[open] summary .chev{transform:rotate(180deg)}
.rvw-b{padding:0 12px 12px}
.rvw-t{color:var(--ink);line-height:2;margin:4px 0}
.rvw-f{margin:8px 0;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.rvw-f img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:10px}
.rvw-f.fig{padding:6px 3px}
.fig svg.narrow{max-width:300px}
.rvw-f figcaption{margin-top:6px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.rvw-t h4{margin:12px 0 0;font-size:14.5px;font-weight:800;color:var(--acc);line-height:1.8}
.rvw-b>.rvw-t:first-child h4{margin-top:2px}
.rvw-t ul{margin:2px 0;padding-inline-start:18px}
.rvw-t li{margin:3px 0;line-height:1.95}
.rvw-t li::marker{color:var(--acc)}
.rvw-t p{margin:3px 0}
.rvw-t .tw{margin:6px 0}
.rvw-t .dt{font-size:12.5px;line-height:1.7}
.rvw-t .dt td.w,.rvw-t .dt th.w{white-space:normal;text-align:start;min-width:5em}
.rvw-t code{direction:ltr;unicode-bidi:isolate;font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px;background:var(--bg2);padding:1px 5px;border-radius:6px;white-space:nowrap}
/* refresher figures (web/js/tools/rv-*.js) */
.rf{direction:ltr;fill:var(--ink);font-size:12px}
.rf text{unicode-bidi:plaintext;text-anchor:middle;font-family:"Segoe UI",Roboto,Arial,sans-serif}
.rf .st{text-anchor:start}.rf .en{text-anchor:end}
.rf-e{stroke:var(--line2);stroke-width:1.6;fill:none}
.rf-e.on{stroke:var(--acc);stroke-width:3.2;stroke-linecap:round}
.rf-e.dsh{stroke-dasharray:5 4}
.rf-e.rung{stroke:var(--ink3);stroke-width:2}
.rf-n{fill:var(--surface2);stroke:var(--ink3);stroke-width:1.5}

.rf-n.g{fill:var(--ok-soft);stroke:var(--ok)}
.rf-n.c1{fill:var(--hx-soft);stroke:var(--hx);stroke-width:2}
.rf-n.c2{fill:var(--ds-soft);stroke:var(--ds);stroke-width:2}
.rf-n.c3{fill:var(--ex-soft);stroke:var(--ex);stroke-width:2}
.rf .rf-l{font-size:14px;font-weight:800;fill:var(--ink)}
.rf .rf-l.sm{font-size:13px}
.rf .rf-s{font-size:13px;fill:var(--ink2)}
.rf .rf-s.b{font-weight:800;fill:var(--ink)}
.rf .rf-a{font-size:13px;font-weight:800;fill:var(--acc)}
.rf .rf-i{font-size:11px;font-weight:700;fill:var(--ink3)}
.rf .rf-m{font-size:16px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;fill:var(--ink)}
.rf .rf-w{font-size:13.5px;font-weight:800;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.rf .rf-ok{font-size:12px;font-weight:700;fill:var(--ok)}
.rf .rf-bad{font-size:12px;font-weight:700;fill:var(--bad)}
.rf .rf-bt{font-size:11px;font-weight:800;fill:var(--surface)}
.rf-b1{fill:var(--acc)}.rf-b2{fill:var(--ex)}
.rf-ct{fill:var(--acc);fill-opacity:.07;stroke:var(--acc);stroke-width:1.4}
.rf-area{fill:var(--acc-soft)}
.rf-curve{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linejoin:round}
.rf-dot{fill:var(--bad)}
.rf-ar{fill:var(--ink3)}
.rf-p1{fill:var(--acc)}.rf-p2{fill:var(--ex)}
.rf-ring{fill:none;stroke:var(--ink);stroke-width:1.4}
.rf-cell{fill:var(--surface2);stroke:var(--line2);stroke-width:1.2}
.rf-cell.on{fill:var(--acc-soft)}
@media (max-width:380px){.cgrid,.sgrid{grid-template-columns:1fr}}

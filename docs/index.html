/* components/question: question card in three modes
   e = worked example (all steps + key shown), p = practice (try, mark, reveal steps), t = timed self-test (select only) */
function keySrc(q){if(q.src==='s')return 'کلید نهایی سنجش';if(q.src==='v')return 'پاسخ با حل مستقل';if(q.y===1404)return 'کلید سنجش';return 'کلید اولیه سنجش';}
function qst(id){var s=S.q[id];if(!s||typeof s!=='object'){s={t:[],r:0};S.q[id]=s;}if(!Array.isArray(s.t))s.t=[];return s;}
function qState(id){var s=S.q[id];if(!s||!s.t||!Q[id])return '';if(s.t.length&&s.t[0]===Q[id].key)return 'ok';if(s.done)return 'done';if(s.t.length)return 'bad';return '';}
function qCard(id,mode){
  var q=Q[id];
  var h='<div class="q q-'+mode+'" data-q="'+id+'" data-mode="'+mode+'">'+
    '<div class="qm"><span class="qy">کنکور '+fa(q.y)+' <b>سوال '+fa(q.n)+'</b></span><span class="qk">'+keySrc(q)+'</span></div>'+
    '<div class="qt">'+rich(q.t)+'</div>'+(q.fig?'<div class="fig">'+FIG[q.fig]()+'</div>':'')+
    '<div class="opts">'+q.o.map(function(o,k){return '<button type="button" class="opt" data-k="'+(k+1)+'"><span class="onum">'+fa(k+1)+'</span><span class="ot">'+rich(o)+'</span><span class="om"></span></button>';}).join('')+'</div>';
  if(mode==='p'){
    h+='<div class="fb" aria-live="polite"></div><ol class="steps"></ol><div class="qa"><button type="button" class="btn ghost" data-qa="next">قدم بعدی راه‌حل</button><button type="button" class="btn ghost soft" data-qa="all">کل راه‌حل</button></div>';
  }else if(mode==='e'){
    h+='<ol class="steps"></ol>';
  }
  return h+'</div>';
}
function markOpt(b,cls){b.classList.remove('ok','bad','key');if(cls){void b.offsetWidth;b.classList.add(cls);}var m=$('.om',b);if(m)m.innerHTML=cls==='ok'||cls==='key'?IC.check:(cls==='bad'?IC.x:'');}
function renderSteps(qe,n,anim){var q=Q[qe.dataset.q],ol=$('.steps',qe);if(!ol)return;for(var i=ol.children.length;i<n;i++){var li=D.createElement('li');li.innerHTML=rich(q.s[i]);if(anim===false)li.style.animation='none';else if(anim==='stagger')li.style.animationDelay=(i*0.06)+'s';ol.appendChild(li);}}
function hydrateQ(qe){
  var id=qe.dataset.q,q=Q[id],mode=qe.dataset.mode;
  if(mode==='e'){renderSteps(qe,q.s.length,'stagger');markOpt($('.opt[data-k="'+q.key+'"]',qe),'key');return;}
  if(mode!=='p')return;
  var s=S.q[id];
  if(!s)return;
  (s.t||[]).forEach(function(k){var b=$('.opt[data-k="'+k+'"]',qe);if(b)markOpt(b,k===q.key?'ok':'bad');});
  if(s.r)renderSteps(qe,s.r,false);
  if(s.r>=q.s.length)markOpt($('.opt[data-k="'+q.key+'"]',qe),(s.t||[]).indexOf(q.key)>=0?'ok':'key');
  updQA(qe);
}
function updQA(qe){
  var id=qe.dataset.q,q=Q[id],s=S.q[id]||{t:[],r:0},fb=$('.fb',qe);
  var nb=$('[data-qa="next"]',qe),ab=$('[data-qa="all"]',qe);
  var full=(s.r||0)>=q.s.length;
  if(nb){nb.disabled=full;nb.textContent=full?'راه‌حل کامل شد':'قدم بعدی راه‌حل';}
  if(ab)ab.hidden=full;
  if(fb){
    var t=s.t||[];
    if(t.length&&t[t.length-1]===q.key)fb.innerHTML='<span class="fb-ok">'+IC.check+(t.length===1?'درست در اولین تلاش':'درست در تلاش '+fa(t.length))+'</span>';
    else if(t.length)fb.innerHTML='<span class="fb-bad">'+IC.x+'گزینه '+fa(t[t.length-1])+' درست نیست</span>';
    else fb.innerHTML='';
  }
}
function refreshDots(id){var d=$('.dot[data-q="'+id+'"]');if(d){d.className='dot '+qState(id);}}
function onOpt(b){
  var qe=b.closest('.q');if(!qe)return;
  var mode=qe.dataset.mode;
  if(mode==='t'){testPick(qe,b);return;}
  if(mode!=='p')return;
  var id=qe.dataset.q,q=Q[id],k=+b.dataset.k,s=qst(id);
  if(s.t.indexOf(q.key)>=0||s.t.indexOf(k)>=0)return;
  s.t.push(k);
  if(k===q.key){s.done=1;markOpt(b,'ok');}
  else markOpt(b,'bad');
  save();updQA(qe);refreshDots(id);refreshProgress();
}
function onQA(b){
  var qe=b.closest('.q'),id=qe.dataset.q,q=Q[id],s=qst(id);
  s.r=b.dataset.qa==='next'?Math.min(q.s.length,(s.r||0)+1):q.s.length;
  if(s.r>=q.s.length){s.done=1;markOpt($('.opt[data-k="'+q.key+'"]',qe),s.t.indexOf(q.key)>=0?'ok':'key');}
  renderSteps(qe,s.r,true);save();updQA(qe);refreshDots(id);refreshProgress();
  var last=$('.steps li:last-child',qe);if(last&&last.getBoundingClientRect().bottom>W.innerHeight-90)last.scrollIntoView({behavior:'smooth',block:'center'});
}

/* components/rings: progress rings and per-course progress */
function ringSvg(frac,cls){var C=2*Math.PI*18;return '<svg viewBox="0 0 44 44" class="ring '+(cls||'')+'" aria-hidden="true"><circle cx="22" cy="22" r="18" class="rt"/><circle cx="22" cy="22" r="18" class="rv" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(2)+'"/></svg>';}
function setRing(el,frac){var C=2*Math.PI*18;var v=$('.rv',el);if(v)v.setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(2));}
/* practice questions done in a course (the worked example is not counted, as in v1) */
function courseStats(c){var ids=[];PATTERNS.forEach(function(p){if(p.c===c)ids=ids.concat(p.pr);});var d=0;ids.forEach(function(id){var s=S.q[id];if(s&&s.done)d++;});return {n:ids.length,done:d};}
function frac(st){return st.n?st.done/st.n:0;}
function pct(x){return '<bdi>'+fa((Math.round(x*10)/10).toString().replace('-','−'))+'٪</bdi>';}
function refreshProgress(){
  LIVE.forEach(function(co){var c=co.id,st=courseStats(c);$$('.ring.'+c).forEach(function(r){setRing(r.parentNode,frac(st));});$$('.cst[data-c="'+c+'"]').forEach(function(x){x.textContent=fa(st.done)+' از '+fa(st.n)+(x.dataset.u?' '+x.dataset.u:'');});});
  $$('.tst').forEach(function(el){var t=S.test[el.dataset.c];el.innerHTML=t&&typeof t.best==='number'?'<span>بهترین <b>'+pct(t.best)+'</b></span><span>آخرین <b>'+pct(t.last)+'</b></span>':'';});
}

/* components/selftest: timed self-test sheet with negative marking (3C-W)/3N, 135 s per question */
var T=null;
function sheetEl(){return $('#sheet');}
function startTest(c){
  T={c:c,ids:SELFTEST[c].slice(),ans:{},i:0,total:SELFTEST[c].length*135,t0:Date.now(),done:false};
  var sh=sheetEl();
  sh.innerHTML='<div class="sh-h"><div class="sh-t"><b>آزمونک '+COURSE[c].name+'</b><span class="sh-n"></span></div><div class="timer" aria-live="off"><b class="tm"></b><i></i><span class="ts2"></span></div><button type="button" class="icon-btn" data-ts="end" aria-label="پایان">'+IC.x+'</button></div>'+
    '<div class="sh-dots">'+T.ids.map(function(id,j){return '<button type="button" data-ts="go" data-j="'+j+'">'+fa(j+1)+'</button>';}).join('')+'</div><div class="sh-b"></div>'+
    '<div class="sh-f"><button type="button" class="btn ghost" data-ts="prev">قبلی</button><button type="button" class="btn" data-ts="next">بعدی</button></div>';
  sh.className='sheet '+c;sh.hidden=false;D.body.classList.add('lock');
  showTQ();tick();T.iv=setInterval(tick,250);
}
function tick(){
  if(!T||T.done)return;
  var left=Math.max(0,T.total-Math.floor((Date.now()-T.t0)/1000)),m=Math.floor(left/60),s=left%60;
  var sh=sheetEl();$('.tm',sh).textContent=fa(m<10?'0'+m:m);$('.ts2',sh).textContent=fa(s<10?'0'+s:s);
  $('.timer',sh).classList.toggle('warn',left<=120);
  if(left===0)finishTest();
}
function showTQ(){
  var sh=sheetEl(),id=T.ids[T.i],b=$('.sh-b',sh);
  b.innerHTML=qCard(id,'t');b.firstChild.classList.add('enter');
  var a=T.ans[id];if(a)$('.opt[data-k="'+a+'"]',b).classList.add('sel');
  $('.sh-n',sh).textContent='سوال '+fa(T.i+1)+' از '+fa(T.ids.length);
  $$('.sh-dots button',sh).forEach(function(x,j){x.classList.toggle('cur',j===T.i);x.classList.toggle('ans',!!T.ans[T.ids[j]]);});
  $('[data-ts="prev"]',sh).disabled=T.i===0;
  var nx=$('[data-ts="next"]',sh);nx.textContent=T.i===T.ids.length-1?'پایان و نمره':'بعدی';
  sh.scrollTop=0;b.scrollTop=0;
}
function testPick(qe,b){
  if(!T||T.done)return;var id=qe.dataset.q,k=+b.dataset.k;
  if(T.ans[id]===k){delete T.ans[id];b.classList.remove('sel');}
  else{T.ans[id]=k;$$('.opt',qe).forEach(function(o){o.classList.toggle('sel',o===b);});}
  var j=T.ids.indexOf(id);$$('.sh-dots button',sheetEl())[j].classList.toggle('ans',!!T.ans[id]);
}
function finishTest(){
  if(!T||T.done)return;T.done=true;clearInterval(T.iv);
  var C=0,Wr=0,B=0,N=T.ids.length;
  T.ids.forEach(function(id){var a=T.ans[id];if(!a)B++;else if(a===Q[id].key)C++;else Wr++;});
  var p=(3*C-Wr)/(3*N)*100,used=Math.min(T.total,Math.round((Date.now()-T.t0)/1000));
  var prev=S.test[T.c];var best=prev&&typeof prev.best==='number'?Math.max(prev.best,p):p;
  S.test[T.c]={best:best,last:p,at:Date.now()};save();refreshProgress();
  var sh=sheetEl();
  $('.timer',sh).classList.add('stop');$('.sh-dots',sh).hidden=true;$('.sh-n',sh).textContent='نتیجه';
  var h='<div class="res enter"><div class="score"><b>'+pct(p)+'</b><span>نمره با احتساب نمره منفی</span></div>'+
    '<div class="rc"><div class="g"><b>'+fa(C)+'</b><span>درست</span></div><div class="b"><b>'+fa(Wr)+'</b><span>غلط</span></div><div><b>'+fa(B)+'</b><span>نزده</span></div><div><b>'+fa(Math.floor(used/60))+'<small>دقیقه</small>'+fa(used%60)+'<small>ثانیه</small></b><span>زمان</span></div></div>'+
    '<p class="best">بهترین نمره تا حالا '+pct(best)+'</p><h3>مرور</h3>';
  T.ids.forEach(function(id,j){
    var q=Q[id],a=T.ans[id],cls=!a?'blank':(a===q.key?'good':'bad'),pt=patOf(id);

function simAB(T){
  var F=[],st={},pr={};
  function nm(n){return n.ch?n.nm:(n.lb?'برگ '+n.lb:'برگ $'+n.v+'$');}
  function snap(n,msg){F.push({cur:n.id,st:JSON.parse(JSON.stringify(st,function(k,v){return v===Infinity?'+I':(v===-Infinity?'-I':v);}),function(k,v){return v==='+I'?Infinity:(v==='-I'?-Infinity:v);}),pr:Object.assign({},pr),msg:msg});}
  function mp(n){walk(n,function(x){pr[x.id]=1;});}
  function fm(x){return x===Infinity?'+\\infty':(x===-Infinity?'-\\infty':String(x));}
  function rec(n,a,b){
    if(!n.ch){st[n.id]={v:n.v,done:1};snap(n,nm(n)+' با مقدار $'+n.v+'$');return n.v;}
    var mx=n.t==='max',v=mx?-Infinity:Infinity;
    st[n.id]={a:a,b:b,v:null};
    snap(n,'ورود به '+nm(n)+' با $\\alpha='+fm(a)+'$ و $\\beta='+fm(b)+'$');
    for(var i=0;i<n.ch.length;i++){
      var cv=rec(n.ch[i],a,b);
      if(mx){
        v=Math.max(v,cv);st[n.id].v=v;
        if(v>=b){var rest=n.ch.slice(i+1);rest.forEach(mp);st[n.id].done=1;snap(n,rest.length?'در '+nm(n)+' داریم $v='+fm(v)+'\\ge\\beta='+fm(b)+'$ پس '+fa(rest.length)+' فرزند بعدی هرس شد':'در '+nm(n)+' داریم $v='+fm(v)+'\\ge\\beta$ و برمی‌گردد');return v;}
        a=Math.max(a,v);st[n.id].a=a;
        snap(n,'در '+nm(n)+' حالا $v='+fm(v)+'$ و $\\alpha='+fm(a)+'$');
      }else{
        v=Math.min(v,cv);st[n.id].v=v;
        if(v<=a){var rest2=n.ch.slice(i+1);rest2.forEach(mp);st[n.id].done=1;snap(n,rest2.length?'در '+nm(n)+' داریم $v='+fm(v)+'\\le\\alpha='+fm(a)+'$ پس '+fa(rest2.length)+' فرزند بعدی هرس شد':'در '+nm(n)+' داریم $v='+fm(v)+'\\le\\alpha$ و برمی‌گردد');return v;}
        b=Math.min(b,v);st[n.id].b=b;
        snap(n,'در '+nm(n)+' حالا $v='+fm(v)+'$ و $\\beta='+fm(b)+'$');
      }
    }
    st[n.id].done=1;snap(n,'مقدار نهایی '+nm(n)+' برابر $'+fm(v)+'$');return v;
  }
  var val=rec(T.t,-Infinity,Infinity);
  var cut=T.leaves.filter(function(l){return pr[l.id];});
  var last=F[F.length-1];
  F.push({cur:T.t.id,st:last.st,pr:last.pr,msg:'مقدار ریشه $'+val+'$ و '+(cut.length?fa(cut.length)+' برگ هرس شد ('+cut.map(function(l){return l.lb?l.lb:'$'+l.v+'$';}).join(' و ')+')':'هیچ گره‌ای هرس نشد'),end:1});
  return F;
}

function subSize(i,n){var c=0,st=[i];while(st.length){var x=st.pop();if(x>n)continue;c++;st.push(2*x,2*x+1);}return c;}

    else if(k<=n&&i>=2&&d<=k-1&&k-1<=n-subSize(i,n))r.push(i);
  }
  return r;
}

function hstar(dir){
  var dist={},adj={};HG.nodes.forEach(function(k){dist[k]=Infinity;adj[k]=[];});
  HG.e.forEach(function(e){adj[e[1]].push([e[0],e[2]]);if(!dir)adj[e[0]].push([e[1],e[2]]);});
  dist.G=0;var done={};
  for(var it=0;it<HG.nodes.length;it++){
    var u=null;HG.nodes.forEach(function(k){if(!done[k]&&(u===null||dist[k]<dist[u]))u=k;});
    if(u===null||!isFinite(dist[u]))break;done[u]=1;
    adj[u].forEach(function(p){if(dist[u]+p[1]<dist[p[0]])dist[p[0]]=dist[u]+p[1];});
  }
  return dist;
}

/* tools/huffman: Huffman merge calculator (tool "huff") */
function huff(ws){
  var nodes=ws.map(function(w,i){return {w:w,ids:[i],o:i};}),len=ws.map(function(){return 0;}),merges=[],o=ws.length;
  while(nodes.length>1){
    nodes.sort(function(a,b){return a.w-b.w||a.o-b.o;});
    var x=nodes.shift(),y=nodes.shift(),z={w:x.w+y.w,ids:x.ids.concat(y.ids),o:o++};
    z.ids.forEach(function(i){len[i]++;});merges.push([x.w,y.w,z.w]);nodes.push(z);
  }
  return {merges:merges,total:merges.reduce(function(s,m){return s+m[2];},0),len:len};
}

/* tools/master: master theorem with the extended log case (tool "master") */
function fStr(k,p){
  var a=k===0?'':(k===1?'n':(k===0.5?'\\sqrt{n}':'n^{'+k+'}'));
  var b=p===0?'':(p===1?'\\log n':(p===-1?'\\frac{1}{\\log n}':(p<0?'\\frac{1}{\\log^{'+(-p)+'} n}':'\\log^{'+p+'} n')));
  if(!a&&!b)return '1';
  if(p<0)return a?'\\frac{'+a+'}{\\log'+(p===-1?'':'^{'+(-p)+'}')+' n}':b;
  return a+(a&&b?'\\,':'')+b;
}

/* tools/rv-ai: exact figures for the AI «یادآوری» refreshers (figRv*), plus the small SVG helpers the DS refresher figures share.
   Colours come from CSS classes (.rf, .rf-*) so every figure follows the light/dark theme; labels are Latin (LTR) on purpose. */
function rfSvg(w,h,label,body,cls){return '<svg viewBox="0 0 '+w+' '+h+'" class="'+(cls||'rf')+'" role="img" aria-label="'+label+'">'+body+'</svg>';}
function rfL(x1,y1,x2,y2,c){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="rf-e'+(c?' '+c:'')+'"/>';}
function rfC(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="'+c+'"/>';}
function rfT(x,y,s,c,extra){return '<text x="'+x+'" y="'+y+'" class="'+(c||'rf-s')+'"'+(extra||'')+'>'+s+'</text>';}
function rfN(x,y,r,s,c){return rfC(x,y,r,'rf-n'+(c?' '+c:''))+rfT(x,y+4.5,s,'rf-l');}
function rfBox(x,y,w,h,s,c,tc){return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="7" class="rf-n'+(c?' '+c:'')+'"/>'+rfT(x,y+4.5,s,tc||'rf-l');}
/* straight edge from the rim of one node to the rim of the other (ra, rb = radii) */
function rfEdge(a,b,ra,rb,c,mk){
  var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy),ux=dx/L,uy=dy/L;
  return '<line x1="'+(a[0]+ux*ra).toFixed(1)+'" y1="'+(a[1]+uy*ra).toFixed(1)+'" x2="'+(b[0]-ux*rb).toFixed(1)+'" y2="'+(b[1]-uy*rb).toFixed(1)+'" class="rf-e'+(c?' '+c:'')+'"'+(mk?' marker-end="url(#'+mk+')"':'')+'/>';
}
/* label at the middle of edge a-b, pushed sideways by off (sign picks the side) */
function rfMid(a,b,off,s,c){
  var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy),nx=-dy/L,ny=dx/L;
  return rfT(((a[0]+b[0])/2+nx*off).toFixed(1),((a[1]+b[1])/2+ny*off+4).toFixed(1),s,c||'rf-w');
}

  var Rk=SITE.home.rank,ps=PATTERNS.filter(function(p){return p.rank;}).sort(function(a,b){return a.rank.order-b.rank.order;});
  return '<section class="card"><h2>'+Rk.title+'</h2><p class="lead">'+Rk.lead+'</p><ol class="rank">'+
    ps.map(function(p,j){var r=p.rank;return '<li><button type="button" class="rk '+p.c+'" data-go="'+p.c+'/'+p.id+'"><span class="rn">'+fa(j+1)+'</span><span class="rt">'+p.t+'<small>'+cShort(p.c)+'</small></span><span class="rf"><span>'+(r.repeat.indexOf(' از ')>0?'تکرار '+r.repeat:r.repeat)+'</span><span>'+fa(r.hours)+' ساعت</span></span></button></li>';}).join('')+'</ol></section>';
}
function planHTML(){
  var Pl=SITE.home.plan,wk=[],h;
  for(var w=1;w<=Pl.weeks;w++)wk.push(w);
  h='<section class="card"><div class="ch2"><h2>'+Pl.title+'</h2>'+seg(wk.map(function(w){return [w,'هفته '+fa(w)];}),S.week||1,'weeks')+'</div><div class="plan">';
  wk.forEach(function(w){h+='<ul class="pl'+((S.week||1)===w?' on':'')+'" data-w="'+w+'">'+PLAN.filter(function(d){return d.w===w;}).map(function(d){var on=!!S.plan[d.id];return '<li><button type="button" class="prow'+(on?' on':'')+'" data-p="'+d.id+'" aria-pressed="'+on+'"><span class="pcb">'+IC.check+'</span><span class="pd">روز '+fa(d.id.slice(1))+'</span><span class="ptx">'+planText(d)+'</span></button></li>';}).join('')+'</ul>';});
  return h+'</div></section>';
}
function homeHTML(){
  var H=SITE.home;
  var h='<section class="hero"><h1>'+H.title+'</h1><p class="sub">'+liveNames()+'<br><span>'+H.subtitle+'</span></p>'+
    '<div class="hrings">'+LIVE.map(function(c){var st=courseStats(c.id);return '<button type="button" class="hrc '+c.id+'" data-go="'+c.id+'">'+ringSvg(frac(st),c.id)+'<span><b>'+cShort(c.id)+'</b><small class="cst" data-c="'+c.id+'" data-u="تمرین">'+fa(st.done)+' از '+fa(st.n)+' تمرین</small></span></button>';}).join('')+'</div></section>';
  h+='<div id="homeReg">'+regHTML()+'</div><div id="homeCd">'+countdownHTML()+'</div>';
  h+=courseMapHTML()+weightsHTML()+rankHTML()+planHTML();
  h+='<section class="card"><h2>'+H.sources.title+'</h2><ul class="srcs">'+H.sources.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p class="src">'+H.sources.note+'</p></section>';
  return h;
}

/* boot/app: views and nav built from the course registry, routing (#view/pattern), theme, boot */
var VIEWS=['home'].concat(LIVE.map(function(c){return c.id;})).concat(['exam']),cur=null;
function navInd(){
  var nav=$('#nav'),on=$('#nav button[data-v="'+cur+'"]'),ind=$('#nav .ind');
  $$('#nav button').forEach(function(b){var o=b===on;b.classList.toggle('on',o);if(o)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(on&&ind){var nr=nav.getBoundingClientRect(),br=on.getBoundingClientRect();ind.style.width=br.width+'px';ind.style.transform='translateX('+(br.left-nr.left+nav.scrollLeft)+'px)';}
}
function show(v,sub){
  if(v!==cur){
    cur=v;
    $$('.view').forEach(function(el){var on=el.id==='v-'+v;el.hidden=!on;if(on){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');}});
    D.documentElement.setAttribute('data-view',v);
    navInd();
    if(!sub)W.scrollTo(0,0);
    S.view=v;save();
  }
  if(sub){var p=$('#p-'+sub);if(p){togglePat(p,true);setTimeout(function(){p.scrollIntoView({behavior:'smooth',block:'start'});},80);}}
}
function route(){var h=(location.hash||'').replace(/^#/,'').split('/');var v=VIEWS.indexOf(h[0])>=0?h[0]:'home';show(v,h[1]);}
function isDark(){var t=S.theme;if(t==='dark')return true;if(t==='light')return false;try{return W.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function applyTheme(){
  var r=D.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  var dk=isDark();$('#themeBtn').innerHTML=dk?IC.sun:IC.moon;$('#themeBtn').setAttribute('aria-label',dk?'پوسته روشن':'پوسته تیره');
  var m=$('meta[name="theme-color"]');if(m)m.setAttribute('content',dk?'#121624':'#f3efe6');
}
function buildShell(){
  var navItems=[['home','نقشه','map']].concat(LIVE.map(function(c){return [c.id,cShort(c.id),IC[c.icon]?c.icon:'book'];})).concat([['exam','روز آزمون','exam']]);
  var nav=$('#nav');
  nav.innerHTML='<span class="ind" aria-hidden="true"></span>'+navItems.map(function(n){return '<button type="button" data-v="'+n[0]+'">'+IC[n[2]]+'<span>'+n[1]+'</span></button>';}).join('');
  nav.classList.toggle('many',navItems.length>5);
  $('#app').innerHTML=VIEWS.map(function(v){return '<div class="view" id="v-'+v+'"'+(v==='home'?'':' hidden')+'></div>';}).join('');
  $('#v-home').innerHTML=homeHTML();
  LIVE.forEach(function(c){$('#v-'+c.id).innerHTML=courseHTML(c.id);});
  $('#v-exam').innerHTML=examHTML();
  $$('#v-exam .wg[data-w]').forEach(mountTool);
}
function boot(){
  buildShell();
  $$('.dot[data-q]').forEach(function(d){d.className='dot '+qState(d.dataset.q);});
  refreshProgress();applyTheme();
  D.addEventListener('click',function(e){
    var t=e.target,b;
    if(t.closest('.wg'))return;
    if((b=t.closest('[data-ts]'))){onTS(b);return;}
    if((b=t.closest('.pat-h'))){togglePat(b.parentNode);return;}
    if((b=t.closest('.opt'))){onOpt(b);return;}
    if((b=t.closest('[data-qa]'))){onQA(b);return;}
    if((b=t.closest('#nav button'))){var v=b.dataset.v;if(location.hash==='#'+v)W.scrollTo({top:0,behavior:'smooth'});else location.hash='#'+v;return;}
    if((b=t.closest('[data-go]'))){location.hash='#'+b.dataset.go;return;}
    if((b=t.closest('.prow'))){var id=b.dataset.p,on=!S.plan[id];if(on)S.plan[id]=1;else delete S.plan[id];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');save();return;}
    if((b=t.closest('.weeks button'))){var w=+b.dataset.v;S.week=w;save();segOn(b.parentNode,w);$$('.pl').forEach(function(u){u.classList.toggle('on',+u.dataset.w===w);});return;}
    if((b=t.closest('[data-test]'))){startTest(b.dataset.test);return;}
    if((b=t.closest('#themeBtn'))){S.theme=isDark()?'light':'dark';save();D.documentElement.classList.add('tt');applyTheme();setTimeout(function(){D.documentElement.classList.remove('tt');},520);return;}
  });
  D.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('rvw'))onReviewToggle(e.target);},true);
  D.addEventListener('keydown',function(e){if(e.key==='Escape'&&T){if(T.done)closeSheet();}});
  D.addEventListener('visibilitychange',function(){if(!D.hidden)refreshDates();});
  setInterval(refreshDates,60000);
  W.addEventListener('hashchange',route);
  W.addEventListener('resize',function(){navInd();});
  try{W.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
  if(!location.hash&&S.view&&VIEWS.indexOf(S.view)>=0&&S.view!=='home'){try{history.replaceState(null,'','#'+S.view);}catch(e){}}
  route();
  setTimeout(navInd,60);
  if(D.fonts&&D.fonts.ready)D.fonts.ready.then(navInd);
  /* offline support: only the hosted build links a manifest and ships sw.js */
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&$('link[rel="manifest"]')){
    W.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot);else boot();

})();
</script>
</body>
</html>
